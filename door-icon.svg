<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Worth Entering — app icon.
    A ticket, because that is the unit the whole system deals in: one entry,
    one ticket, one chance. The tick inside it is the confirmed entry — the
    single fact the app exists to record (DEC-029: one gesture, one fact).

    Drawn as a maskable icon: everything meaningful sits inside the safe
    zone (centre 80%), so Android's circle/squircle masks cannot clip it.
  -->
  <rect width="512" height="512" rx="112" fill="#0f1720"/>

  <!-- Ticket body. The notches are cut with the background colour so the
       shape reads as a torn stub at any size, including 48px. -->
  <g transform="rotate(-8 256 256)">
    <rect x="96" y="164" width="320" height="184" rx="26"
          fill="none" stroke="#4fd1a5" stroke-width="22"/>

    <!-- Perforation line: the stub you keep -->
    <line x1="322" y1="186" x2="322" y2="326"
          stroke="#4fd1a5" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="2 26"/>

    <!-- Side notches, punched out in the background colour -->
    <circle cx="96" cy="256" r="30" fill="#0f1720"/>
    <circle cx="416" cy="256" r="30" fill="#0f1720"/>

    <!-- The confirmed entry -->
    <path d="M158 258l42 42 76-88" fill="none" stroke="#4fd1a5" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
